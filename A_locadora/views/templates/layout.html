<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Locadora{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('dashboard.index') }}" class="logo">🚗 Locadora</a>
        <a href="{{ url_for('locadora.index') }}">Locações</a>
        <a href="{{ url_for('locadora.cadastrar') }}">+ Nova locação</a>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
