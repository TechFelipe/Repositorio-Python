{% extends "base.html" %}
{% block title %}Editar tarefa - TaskPanel{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4"><i class="bi bi-pencil-square text-primary"></i> Editar tarefa</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" value="{{ tarefa['titulo'] }}" class="form-control" maxlength="120" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="5">{{ tarefa['descricao'] or '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option {% if tarefa['status'] == 'Pendente' %}selected{% endif %}>Pendente</option>
                            <option {% if tarefa['status'] == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                            <option {% if tarefa['status'] == 'Concluída' %}selected{% endif %}>Concluída</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary"><i class="bi bi-save"></i> Salvar alterações</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
