{% extends "base.html" %}
{% block title %}Login - TaskPanel{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-check2-square display-4 text-primary"></i>
                    <h2 class="fw-bold mt-2">Entrar</h2>
                    <p class="text-secondary">Acesse seu painel de tarefas.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required autocomplete="current-password">
                    </div>

                    <button class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Ainda não possui conta?
                    <a href="{{ url_for('registro') }}">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
