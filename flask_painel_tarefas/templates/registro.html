{% extends "base.html" %}
{% block title %}Cadastro - TaskPanel{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4"><i class="bi bi-person-plus text-primary"></i> Criar conta</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" minlength="6" required>
                        <div class="form-text">Mínimo de 6 caracteres.</div>
                    </div>

                    <button class="btn btn-primary w-100">
                        <i class="bi bi-person-check"></i> Criar conta
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Já possui conta?
                    <a href="{{ url_for('login') }}">Fazer login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
